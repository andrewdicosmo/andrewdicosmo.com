name: Deploy to Azure Static Web Apps
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      CONTENT_REPO: ${{ secrets.CONTENT_REPO }}
      CONTENT_REPO_PAT: ${{ secrets.CONTENT_REPO_PAT }}
    steps:
      - uses: actions/checkout@v7

      # PRIVATE CONTENT INJECTION (optional):
      # keep your real src/data in a private repo; provide CONTENT_REPO_PAT + CONTENT_REPO
      # secrets and this step swaps the example persona for your cargo at build time.
      - name: Inject private content
        if: ${{ env.CONTENT_REPO != '' }}
        run: |
          git clone --depth 1 https://x-access-token:${CONTENT_REPO_PAT}@github.com/${CONTENT_REPO} private-content
          if [ -d src/data ]; then mv src/data /tmp/src-data-example; fi
          mkdir -p src/data
          cp -r private-content/data/. src/data/

      - name: Set up Node for Astro
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Set up Node for API
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci --omit=dev

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist"
          api_location: "api"
          skip_app_build: true
          skip_api_build: true
