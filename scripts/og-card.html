<!--
  Source for public/og.png, the 1200x630 link-preview card (LinkedIn, Slack,
  iMessage, etc). It is a plain static page so it stays in sync with the site
  theme by hand — if the name, subject line, or accent color changes, update
  the markup below and re-render:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=public/og.png --window-size=1200,630 \
      "file://$PWD/scripts/og-card.html"

  Colors mirror the cyan theme in src/styles/global.css.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #060A0F; color: #E9F2F7;
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(79,216,255,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(79,216,255,.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .tab {
    position: absolute; top: 48px; left: 64px;
    background: #4FD8FF; color: #060A0F; font-weight: 700;
    font-size: 20px; letter-spacing: 3px; padding: 10px 22px;
  }
  .wrap { position: absolute; left: 64px; top: 150px; }
  .brief { color: #4FD8FF; font-size: 24px; letter-spacing: 5px; margin-bottom: 26px; }
  h1 {
    font-family: "Space Grotesk", "Arial Black", sans-serif;
    font-size: 118px; line-height: .95; font-weight: 700; letter-spacing: 2px;
  }
  h1 .last { color: #4FD8FF; }
  .subject { margin-top: 34px; font-size: 27px; color: #E9F2F7; letter-spacing: 1px; }
  .subject b { color: #4FD8FF; }
  .meta { position: absolute; left: 64px; bottom: 52px; font-size: 20px; color: #5d7688; letter-spacing: 2px; }
  .reticle { position: absolute; right: 90px; top: 140px; opacity: .9; }
  .stamp {
    position: absolute; right: 64px; bottom: 48px;
    border: 2px solid #E05A5A; color: #E05A5A; padding: 8px 14px;
    font-size: 15px; letter-spacing: 2px; font-weight: 700;
    transform: rotate(-4deg);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="tab">BUILD LOG // FILE 001</div>
  <div class="wrap">
    <div class="brief">MISSION BRIEF // 23 YEARS OF BUILDING</div>
    <h1>ANDREW<br><span class="last">DICOSMO</span></h1>
    <div class="subject">AI Engineer · <b>Computer Vision &amp; Applied AI Platforms</b></div>
  </div>
  <svg class="reticle" width="300" height="300" viewBox="0 0 32 32">
    <g stroke="#4FD8FF" stroke-width="1.2" fill="none" opacity="0.85">
      <circle cx="16" cy="16" r="9"/>
      <circle cx="16" cy="16" r="13" stroke-dasharray="2 3" opacity="0.5"/>
      <line x1="16" y1="2" x2="16" y2="9"/>
      <line x1="16" y1="23" x2="16" y2="30"/>
      <line x1="2" y1="16" x2="9" y2="16"/>
      <line x1="23" y1="16" x2="30" y2="16"/>
    </g>
    <circle cx="16" cy="16" r="1.8" fill="#4FD8FF"/>
  </svg>
  <div class="meta">TS/SCI ACTIVE · ANDREWDICOSMO.COM</div>
  <div class="stamp">DECLASSIFIED FOR HIRING MANAGERS</div>
</body>
</html>
